[project]
name = "weekend-optimizer"
version = "0.1.0"
description = "Schedule a weekend as an assignment problem, solved with the Hungarian algorithm."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
